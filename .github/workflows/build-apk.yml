name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.6-mega-update

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/dnd-creazione-personaggio-v0.6.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dnd-creazione-personaggio-v0.6.0
          path: build/app/outputs/flutter-apk/dnd-creazione-personaggio-v0.6.0.apk
          if-no-files-found: error
          retention-days: 30
